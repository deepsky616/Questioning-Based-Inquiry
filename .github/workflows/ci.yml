name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # tsc·lint·단위테스트는 DB 연결이 필요 없다. (E2E는 DB·시크릿이 필요해 별도 처리)
    env:
      # 일부 모듈이 import 시 env를 읽을 수 있어 더미 값 주입(실제 연결은 하지 않음)
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      GAME_ACTIVITY_HASH_SECRET: "ci-only-game-activity-hash-secret-00000000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage gate)
        run: npm test -- --coverage

      # 빌드에서만 잡히는 오류(라우트 export 규칙, 정적 생성, 서버/클라이언트 경계)를
      # 배포 전에 차단 — tsc·lint·테스트 전부 녹색인데 Vercel 빌드만 실패했던 사고의 재발 방지.
      # npm run build가 아닌 npx next build인 이유: DB 가드 스크립트는 실제 DB가 필요해
      # Vercel에서 실행되고, 여기서는 더미 env로 빌드 형상만 검증한다.
      - name: Production build (route-shape gate)
        run: npx next build

  e2e-question-games:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 신뢰성 스펙은 인증·방·점수 요청을 브라우저 내부 가짜 상태로 처리한다.
      # 실제 DB나 운영 시크릿 없이 친구 방 흐름을 검증하기 위한 더미 값이다.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Question session filter regression E2E
        run: npx playwright test e2e/question-session-filters.spec.ts --project=chromium

      - name: Question games desktop reliability E2E
        run: npm run test:e2e:question-games

      - name: Upload question games failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: question-games-reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  e2e-tablet:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E_TABLET == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check database schema
        run: npm run db:check

      - name: Check database access security
        run: npm run db:security:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Tablet E2E
        run: npm run test:e2e:tablet

  e2e-print:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E_PRINT == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check database schema
        run: npm run db:check

      - name: Check database access security
        run: npm run db:security:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Question practice print E2E
        run: npm run test:e2e:print

      - name: Upload question practice print artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-practice-print-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
