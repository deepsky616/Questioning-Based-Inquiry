name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # tsc·lint·단위테스트는 DB 연결이 필요 없다. (E2E는 DB·시크릿이 필요해 별도 처리)
    env:
      # 일부 모듈이 import 시 env를 읽을 수 있어 더미 값 주입(실제 연결은 하지 않음)
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXTAUTH_SECRET: "ci-dummy-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage gate)
        run: npm test -- --coverage

  e2e-tablet:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_E2E_TABLET == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.E2E_NEXTAUTH_SECRET }}
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check database schema
        run: npm run db:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Tablet E2E
        run: npm run test:e2e:tablet
